[program:arena_g1_gate_n_se2_low]
command=/usr/bin/bash /workspace/time-invariant-whole-body-policy/scripts/gate_n/run-arena-g1-consumer-gate.sh
directory=/workspace/time-invariant-whole-body-policy
environment=ARENA_G1_ROOT="/workspace/time-invariant-whole-body-policy",GATE_N_CONSUMER_METHODS="se2_waypoint",GATE_N_SEEDS="0 1 2 3 4",GATE_N_SKIP_FINALIZE="1",PYTHONUNBUFFERED="1",ACCEPT_EULA="Y",PRIVACY_CONSENT="Y",OMNI_KIT_ACCEPT_EULA="YES"
