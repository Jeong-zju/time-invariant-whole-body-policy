[program:arena_g1_gate_n_analysis]
environment=PROC_NAME="%(program_name)s",ARENA_G1_ROOT="/workspace/time-invariant-whole-body-policy"
command=/workspace/time-invariant-whole-body-policy/scripts/gate_n/run-arena-g1-gate-n-analysis.sh
directory=/workspace/time-invariant-whole-body-policy
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/time-invariant-whole-body-policy/logs/gate_n/offline-analysis.log
stderr_logfile=/workspace/time-invariant-whole-body-policy/logs/gate_n/offline-analysis.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
