[program:groot_policy_server]
environment=PROC_NAME="%(program_name)s",PHASE_MINUS_ONE_ROOT="/workspace/time-invariant-whole-body-policy",HF_HOME="/workspace/.hf_home"
command=/workspace/time-invariant-whole-body-policy/artifacts/deployment/groot-policy-server.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
