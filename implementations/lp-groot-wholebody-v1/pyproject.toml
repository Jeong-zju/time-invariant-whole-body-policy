[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lp-groot-wholebody-v1"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=17", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
