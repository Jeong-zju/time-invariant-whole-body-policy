[program:lpwb-robocasa365-setup]
command=/bin/bash /workspace/time-invariant-whole-body-policy/implementations/lp-groot-wholebody-v1/scripts/setup_robocasa365_eval.sh
directory=/workspace
autostart=false
autorestart=unexpected
startsecs=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/lpwb-run/logs/robocasa365-setup.log
stderr_logfile=/workspace/lpwb-run/logs/robocasa365-setup.err.log
environment=HOME="/root",PATH="/root/.local/bin:/usr/local/bin:/usr/bin:/bin",UV_LINK_MODE="copy",UV_HTTP_TIMEOUT="1200"
