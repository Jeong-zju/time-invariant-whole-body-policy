[program:lpwb-20k-monitor]
command=/bin/bash /workspace/time-invariant-whole-body-policy/implementations/lp-groot-wholebody-v1/scripts/monitor_20k_pipeline.sh
directory=/workspace/lpwb-run
autostart=false
autorestart=unexpected
startsecs=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/lpwb-run/logs/20k-monitor.log
stderr_logfile=/workspace/lpwb-run/logs/20k-monitor.err.log
environment=HOME="/root",PATH="/root/.local/bin:/usr/local/bin:/usr/bin:/bin"
