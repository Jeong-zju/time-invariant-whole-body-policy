[program:robocasa_lpact_full_gpu1_v2]
command=/opt/supervisor-scripts/robocasa-lpact-full-gpu1-v2.sh
directory=/workspace/lp-act-v1/robocasa-lp-act-v1
autostart=false
autorestart=unexpected
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/robocasa_lpact_full_gpu1_v2.log
stderr_logfile=/var/log/portal/robocasa_lpact_full_gpu1_v2.log
redirect_stderr=true
stdout_logfile_maxbytes=0
environment=HOME="/root",USER="root"
