[program:act_eval_server_turning_radio]
command=/opt/supervisor-scripts/act-eval-server-turning-radio.sh
directory=/workspace/behavior-2026/lp-act-v1
autostart=false
autorestart=unexpected
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/act_eval_server_turning_radio.log
stderr_logfile=/var/log/portal/act_eval_server_turning_radio.log
redirect_stderr=true
stdout_logfile_maxbytes=0
environment=HOME="/root",USER="root"
